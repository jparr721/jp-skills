name: Startup owner verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: extensions/startup
      - run: bun run --cwd extensions/startup typecheck
      - run: bun test extensions/startup/tests
      - run: python3 -m unittest discover -s extensions/startup/probes -p 'test_*driver.py'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
